<main class="pv-principal">
  <div class="pv-cabecalho">
    <h1 class="pv-titulo">Tour guiado</h1>
    <p class="pv-lide">Simule um pedido: lance no tablet do garçom e acompanhe na cozinha. Dados e valores de exemplo.</p>
  </div>

  <div class="pv-abas" role="tablist" aria-label="Telas do sistema">
    <button class="pv-aba" type="button" role="tab" id="aba-ao-vivo" data-vista="ao-vivo" aria-selected="true" aria-controls="palco">Pedido ao vivo</button>
    <button class="pv-aba" type="button" role="tab" id="aba-tablet" data-vista="tablet" aria-selected="false" aria-controls="palco" tabindex="-1">Tablet do garçom</button>
    <button class="pv-aba" type="button" role="tab" id="aba-cozinha" data-vista="cozinha" aria-selected="false" aria-controls="palco" tabindex="-1">Cozinha</button>
    <button class="pv-aba" type="button" role="tab" id="aba-caixa" data-vista="caixa" aria-selected="false" aria-controls="palco" tabindex="-1">Caixa</button>
    <button class="pv-aba" type="button" role="tab" id="aba-gestao" data-vista="gestao" aria-selected="false" aria-controls="palco" tabindex="-1">Gestão</button>
    <button class="pv-aba" type="button" role="tab" id="aba-config" data-vista="config" aria-selected="false" aria-controls="palco" tabindex="-1">Configuração</button>
  </div>
  <p class="pv-dica" id="dica" aria-live="polite"></p>

  <div class="pv-palco" id="palco" role="tabpanel" aria-labelledby="aba-ao-vivo" data-vista="ao-vivo">

    <figure class="pv-item pv-item--tablet">
      <div class="aparelho aparelho--tablet" data-largura="1080" data-altura="675">
        <div class="aparelho__moldura">
          <div class="aparelho__janela"><div class="aparelho__tela" id="tela-tablet"></div></div>
        </div>
      </div>
      <figcaption class="pv-legenda"><strong>Tablet do garçom.</strong> Cada garçom entra com o próprio PIN. O pedido sai em quatro toques: mesa e rosh, essências por marca, adicionais e pagamento.</figcaption>
    </figure>

    <figure class="pv-item pv-item--cozinha">
      <div class="aparelho aparelho--monitor" data-largura="960" data-altura="540">
        <div class="aparelho__moldura">
          <div class="aparelho__janela"><div class="aparelho__tela" id="tela-cozinha"></div></div>
        </div>
        <div class="pv-impressora" id="impressora" aria-hidden="true">
          <div class="pv-impressora__saida"><div class="comanda pv-impressora__comanda" id="comanda-impressa"></div></div>
          <div class="pv-impressora__corpo"></div>
        </div>
      </div>
      <figcaption class="pv-legenda"><strong>Tela da cozinha.</strong> O pedido pago aparece na hora e a comanda sai na impressora ao lado.</figcaption>
    </figure>

    <figure class="pv-item pv-item--caixa">
      <div class="aparelho aparelho--monitor" data-largura="1080" data-altura="675">
        <div class="aparelho__moldura">
          <div class="aparelho__janela"><div class="aparelho__tela" id="tela-caixa"></div></div>
        </div>
      </div>
      <figcaption class="pv-legenda"><strong>Tela do caixa.</strong> Pedido no balcão com pagamento na hora, e o fechamento do turno de quem está no caixa.</figcaption>
    </figure>

    <figure class="pv-item pv-item--gestao">
      <div class="aparelho aparelho--janela" data-largura="1200" data-altura="1000">
        <div class="aparelho__moldura">
          <div class="aparelho__barra" aria-hidden="true"><p>Central Rosh, no navegador</p></div>
          <div class="aparelho__janela"><div class="aparelho__tela" id="tela-gestao"></div></div>
        </div>
      </div>
      <figcaption class="pv-legenda"><strong>Gestão no computador.</strong> O gerente vê a unidade; o master alterna para todas as unidades da rede.</figcaption>
    </figure>

    <figure class="pv-item pv-item--celular">
      <div class="aparelho aparelho--celular" data-largura="390" data-altura="780">
        <div class="aparelho__moldura">
          <div class="aparelho__janela"><div class="aparelho__tela" id="tela-celular"></div></div>
        </div>
      </div>
      <figcaption class="pv-legenda"><strong>Celular do dono.</strong> A gestão feita para a tela pequena: escolha a loja, veja os números e resolva os avisos.</figcaption>
    </figure>

    <figure class="pv-item pv-item--config">
      <div class="aparelho aparelho--janela" data-largura="1200" data-altura="780">
        <div class="aparelho__moldura">
          <div class="aparelho__barra" aria-hidden="true"><p>Central Rosh, no navegador</p></div>
          <div class="aparelho__janela"><div class="aparelho__tela" id="tela-config"></div></div>
        </div>
      </div>
      <figcaption class="pv-legenda"><strong>Configuração.</strong> Gerente e master cadastram marcas, essências, adicionais, tipos de rosh e promoções, e controlam o estoque em pacotes.</figcaption>
    </figure>

  </div>
